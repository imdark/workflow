[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "work-flow"
version = "0.1.0"
description = "Developer workflow CLI"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "keyring>=24.0.0",
    "PyYAML>=6.0",
    "jira>=3.0.0",
    "requests>=2.28.0",
    "typer[all]>=0.7.0",
    "fastmcp>=2.0.0",
    "gitpython>=3.1",
    "rich>=13.0",
    "PyGithub>=2.0",
    "prompt-toolkit>=3.0",
    "argcomplete>=3.0",
    "watchdog>=3.0",
    "psutil>=5.9",
    "aiohttp>=3.9",
    # Imported by the CLI at startup (notifications); pure Python.
    "desktop-notifier>=5.0",
]

[project.optional-dependencies]
# Browser automation: not needed to run agent jobs on a server.
browser = ["playwright>=1.40"]

# Every subpackage (some are namespace packages, without __init__.py) and the
# top-level `commands` the CLI imports, so a plain `pip install` works, not
# only an editable one.
[tool.setuptools.packages.find]
include = ["workflow*", "commands*"]
namespaces = true

[tool.setuptools.package-data]
"workflow.deploy" = ["*.swift"]

[project.scripts]
wf = "workflow.cli:app"
